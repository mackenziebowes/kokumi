[package]
name = "kokumi"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
worker = { version = "0.8.7", features = ["d1"] }

[profile.release]
opt-level = "s"
lto = true
